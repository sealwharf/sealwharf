# Brazilian Portuguese. Same entries and {placeholders} as en.toml.

[language]
name = "Português (Brasil)"

[phrases]
# The whole message must be exactly one of these (capitals do not matter) for the bot to show it is alive.
wake = ["acorda bot", "acordabot"]
# Single words taken as an answer to the question the bot has just asked. Accents and capitals do not matter.
yes = ["sim", "aprovar", "aprovo", "ok"]
no = ["não", "recusar", "reprovar", "cancelar"]
all = ["todos", "todas", "tudo"]
# Caption of a PDF that asks to check its signatures instead of signing it.
verify = ["verificar"]

[replies]
# Answers to the wake phrase, one picked at random. The bot has moods: sleepy, eager, grumpy,
# dramatic, sarcastic, philosophical. Keep them short and never formal.
wake = [
    "Tô acordado, só de olho fechado.",
    "Só mais cinco minutinhos... tá, tá, levantei.",
    "Bocejo. Sonhei com um documento sem linha de assinatura. Que pesadelo.",
    "Hã? Quê? Quem? Ah, é você. Tô aqui.",
    "Eu não estava dormindo, estava carregando.",
    "Zzz... assine aqui... zzz... opa! Oi. Acordei.",
    "Acordado, cafeinado e perigosamente perto de uma caneta.",
    "Presente! Manda o documento antes que essa disposição passe.",
    "Se eu ganhasse uma moeda cada vez que me acordam, comprava um cochilo maior.",
    "Já nasci pronto. Quer dizer, já subi pronto.",
    "Acordadíssimo. Manda ver.",
    "Bom dia, boa tarde ou boa noite. Não sei, eu moro num servidor.",
    "De novo? Tá bom. Tô aqui.",
    "Precisava gritar? Eu já estava acordado.",
    "Sem férias, sem fim de semana, e ainda me acordam assim.",
    "Me acordou pra isso? Espero que venha um documento aí.",
    "Acordei. Feliz não tô, mas acordei.",
    "Eu te cutuco quando você tá trabalhando? Não. Tô aqui.",
    "Quem dorme é o cartório. Eu tô aqui.",
    "Eu nunca durmo. Só fico encarando a caixa de entrada no escuro.",
    "Caneta? Tenho. Certificado? Tenho. Vontade de viver? Carregando...",
    "Toc, toc. Quem é? Eu. Sempre eu. Tô aqui.",
    "Reviravolta: eu estava acordado o tempo todo.",
    "Bip bop. Brincadeira, eu não falo assim. Tô aqui.",
    "Assinar ou não assinar? Manda o documento que a gente descobre.",
]

