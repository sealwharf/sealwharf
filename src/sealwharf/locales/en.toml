# English. This is the reference catalog: every other language has exactly these entries,
# with the same {placeholders}. To add a language, copy this file and translate the values.

[language]
name = "English"

[phrases]
# The whole message must be exactly one of these (capitals do not matter) for the bot to show it is alive.
wake = ["wake up bot", "wakeupbot"]
# Single words taken as an answer to the question the bot has just asked. Accents and capitals do not matter.
yes = ["yes", "approve", "ok"]
no = ["no", "reject", "cancel"]
all = ["all"]
# Caption of a PDF that asks to check its signatures instead of signing it.
verify = ["verify", "check"]

[replies]
# Answers to the wake phrase, one picked at random. The bot has moods: sleepy, eager, grumpy,
# dramatic, sarcastic, philosophical. Keep them short and never formal.
wake = [
    "I'm awake, just resting my eyes.",
    "Five more minutes... okay, fine, I'm up.",
    "Yawn. I was dreaming of a document with no signature line. A nightmare.",
    "Huh? What? Who? Oh, it's you. I'm here.",
    "I wasn't sleeping, I was buffering.",
    "Zzz... sign here... zzz... oh! Hi. I'm awake.",
    "Awake, caffeinated and dangerously close to a pen.",
    "Present! Send the document before this energy wears off.",
    "If I had a coin for every time someone woke me up, I'd buy a longer nap.",
    "I was born ready. Well, deployed ready.",
    "Wide awake. Bring it on.",
    "Good morning, afternoon or evening. I can't tell, I live in a server.",
    "Again? Fine. I'm here.",
    "No need to shout, I was already awake.",
    "No vacation, no weekends, and this is how I get woken up.",
    "You woke me up for this? There had better be a document coming.",
    "I'm awake. Not happy, but awake.",
    "Do I poke you while you're working? No. I'm here.",
    "The notary's office sleeps. I don't.",
    "I never sleep. I just stare at the inbox in the dark.",
    "Pen? Got it. Certificate? Got it. Will to live? Loading...",
    "Knock, knock. Who's there? Me. Always me. I'm here.",
    "Plot twist: I was awake the whole time.",
    "Beep boop. Just kidding, I don't talk like that. I'm here.",
    "To sign or not to sign? Send the document and we'll find out.",
]

