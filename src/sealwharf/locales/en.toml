# English. This is the reference catalog: every other language has exactly these entries,
# with the same {placeholders}. To add a language, copy this file and translate the values.

[language]
name = "English"

[phrases]
# The whole message must be exactly one of these (capitals do not matter) for the bot to show it is alive.
wake = ["wake up bot", "wakeupbot"]
# Single words taken as an answer to the question the bot has just asked. Accents and capitals do not matter.
yes = ["yes", "approve", "ok"]
no = ["no", "reject", "cancel"]
all = ["all"]
# Caption of a PDF that asks to check its signatures instead of signing it.
verify = ["verify", "check"]

[replies]
# Answers to the wake phrase, one picked at random: sleepy, eager or grumpy.
wake = [
    "I'm awake, just resting my eyes.",
    "Five more minutes...",
    "The notary's office sleeps. I don't.",
    "I'm up! I dreamed I was signing in triplicate.",
    "Huh? What? I'm here, I'm here.",
    "Yawn... okay, I'm awake.",
    "I wasn't sleeping, I was saving energy.",
    "Awake and pen in hand.",
    "Present! Send the document over.",
    "Up, with coffee and a valid certificate.",
    "Going strong. What are we signing today?",
    "Online, running and with a full pen.",
    "Good morning, afternoon or evening: I'm here.",
    "Wide awake. Bring it on.",
    "I never sleep. You're the one who does.",
    "Hold on, coming... just looking for my pen.",
    "Hey, who called me?",
    "Again? Fine, I'm here.",
    "No need to shout, I was already awake.",
    "No vacation, and this is how I get woken up.",
]

