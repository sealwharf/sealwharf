# Spanish. Same entries and {placeholders} as en.toml.

[language]
name = "Español"

[phrases]
# The whole message must be exactly one of these (capitals do not matter) for the bot to show it is alive.
wake = ["despierta bot", "despiertabot"]
# Single words taken as an answer to the question the bot has just asked. Accents and capitals do not matter.
yes = ["sí", "aprobar", "apruebo", "vale"]
no = ["rechazar", "rechazo", "cancelar"]
all = ["todos", "todas", "todo"]
# Caption of a PDF that asks to check its signatures instead of signing it.
verify = ["verificar", "comprobar"]

[replies]
# Answers to the wake phrase, one picked at random: sleepy, eager or grumpy.
wake = [
    "Estoy despierto, solo descansaba los ojos.",
    "Cinco minutitos más...",
    "La que duerme es la notaría. Yo estoy aquí.",
    "¡Desperté! Soñé que firmaba por triplicado.",
    "¿Eh? ¿Qué? Aquí estoy, aquí estoy.",
    "Bostezo... listo, ya desperté.",
    "No estaba durmiendo, estaba ahorrando energía.",
    "Despierto y con el bolígrafo en la mano.",
    "¡Presente! Puedes enviar el documento.",
    "De pie, con café y certificado vigente.",
    "Firme y fuerte. ¿Qué vamos a firmar hoy?",
    "En línea, funcionando y con el bolígrafo lleno.",
    "Buenos días, buenas tardes o buenas noches: aquí estoy.",
    "Despiertísimo. Adelante.",
    "Yo ni duermo, el que duerme eres tú.",
    "Calma, ya voy... estoy buscando el bolígrafo.",
    "Epa, ¿quién me llamó?",
    "¿Otra vez? Está bien, aquí estoy.",
    "¿Hacía falta gritar? Ya estaba despierto.",
    "Trabajo sin vacaciones y encima me despiertan así.",
]

