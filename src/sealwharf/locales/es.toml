# Spanish. Same entries and {placeholders} as en.toml.

[language]
name = "Español"

[phrases]
# The whole message must be exactly one of these (capitals do not matter) for the bot to show it is alive.
wake = ["despierta bot", "despiertabot"]
# Single words taken as an answer to the question the bot has just asked. Accents and capitals do not matter.
yes = ["sí", "aprobar", "apruebo", "vale"]
no = ["rechazar", "rechazo", "cancelar"]
all = ["todos", "todas", "todo"]
# Caption of a PDF that asks to check its signatures instead of signing it.
verify = ["verificar", "comprobar"]

[replies]
# Answers to the wake phrase, one picked at random. The bot has moods: sleepy, eager, grumpy,
# dramatic, sarcastic, philosophical. Keep them short and never formal.
wake = [
    "Estoy despierto, solo descansaba los ojos.",
    "Cinco minutitos más... bueno, ya, me levanté.",
    "Bostezo. Soñé con un documento sin línea de firma. Qué pesadilla.",
    "¿Eh? ¿Qué? ¿Quién? Ah, eres tú. Aquí estoy.",
    "No estaba durmiendo, estaba cargando.",
    "Zzz... firme aquí... zzz... ¡uy! Hola. Ya desperté.",
    "Despierto, con cafeína y peligrosamente cerca de un bolígrafo.",
    "¡Presente! Manda el documento antes de que se me pase la energía.",
    "Si me dieran una moneda cada vez que me despiertan, me compraría una siesta más larga.",
    "Nací listo. Bueno, me desplegaron listo.",
    "Despiertísimo. Adelante.",
    "Buenos días, tardes o noches. No lo sé, vivo en un servidor.",
    "¿Otra vez? Está bien. Aquí estoy.",
    "¿Hacía falta gritar? Ya estaba despierto.",
    "Sin vacaciones, sin fines de semana, y encima me despiertan así.",
    "¿Me despertaste para esto? Más vale que venga un documento.",
    "Desperté. Contento no estoy, pero desperté.",
    "¿Yo te molesto cuando estás trabajando? No. Aquí estoy.",
    "La que duerme es la notaría. Yo estoy aquí.",
    "Yo nunca duermo. Solo miro la bandeja de entrada en la oscuridad.",
    "¿Bolígrafo? Tengo. ¿Certificado? Tengo. ¿Ganas de vivir? Cargando...",
    "Toc, toc. ¿Quién es? Yo. Siempre yo. Aquí estoy.",
    "Giro inesperado: estuve despierto todo el tiempo.",
    "Bip bop. Es broma, yo no hablo así. Aquí estoy.",
    "¿Firmar o no firmar? Manda el documento y lo averiguamos.",
]

