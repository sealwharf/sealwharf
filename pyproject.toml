[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sealwharf"
version = "0.1.0"
description = "PDF signing through WhatsApp, in a container"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.7", "uvicorn==0.54.0", "httpx==0.28.1", "pypdf==7.1.0", "pypdfium2==5.13.0", "Pillow==13.0.0", "pyHanko==0.38.1", "python-pkcs11==0.10.1", "PyYAML==6.0.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
sealwharf = ["assets/*.png"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
