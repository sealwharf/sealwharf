<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts for DOCX conversion. Private fonts dropped into config/fonts are used
     as they are; otherwise Word's default fonts fall back to the closest free ones. -->
<fontconfig>
  <dir>/config/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>
  <alias>
    <family>Aptos</family>
    <accept><family>Carlito</family></accept>
  </alias>
  <alias>
    <family>Aptos Display</family>
    <accept><family>Carlito</family></accept>
  </alias>
  <alias>
    <family>Aptos Narrow</family>
    <accept><family>Liberation Sans Narrow</family></accept>
  </alias>
</fontconfig>
